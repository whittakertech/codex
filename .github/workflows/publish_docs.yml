name: Publish Docs

on:
  workflow_call:
    inputs:
      engine_owner:
        description: "GitHub owner of the engine repository (e.g. whittakertech)"
        type: string
        required: true
      engine_repo:
        description: "GitHub repository name of the engine (e.g. midas)"
        type: string
        required: true
      engine_ref:
        description: "Git commit SHA to publish from the engine repository"
        type: string
        required: true
      docs_artifact_name:
        description: "Name of the uploaded docs artifact from the engine workflow"
        type: string
        required: false
        default: 'docs'
      site_url:
        description: "Canonical site URL for the deployed docs (e.g. https://whittakertech.github.io/midas)"
        type: string
        required: true
    secrets:
      CODEX_GITHUB_TOKEN:
        description: >-
          Fine-grained PAT with contents:write on both whittakertech/codex
          (overlay state branches) and the target engine repo (gh-pages).
          Deploy keys are disabled org-wide on GitHub, so this is a PAT, not
          an SSH key.
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      OWNER: ${{ inputs.engine_owner }}
      REPO:  ${{ inputs.engine_repo }}
      REF:   ${{ inputs.engine_ref }}

    steps:
      # ── 1. Checkout Codex (main) ───────────────────────────────────────────
      # Explicit `repository:` matters here: this is a `workflow_call` reusable
      # workflow, and `github.repository` inside a reusable-workflow run
      # resolves to the CALLING repo's context, not this file's own repo. An
      # engine repo (e.g. oscar) calling this cross-repo would otherwise check
      # out ITS OWN source here instead of Codex's -- breaking every step below
      # that needs Codex's npm install / Astro build.
      #
      # `token` matters too, for the SAME cross-repo reason: step 6/11's
      # `git push origin $OVERLAY_BRANCH` (persisting state back to Codex)
      # reuses whatever auth this checkout configured for `origin`. The
      # default GITHUB_TOKEN is scoped to the CALLING repo (e.g. oscar), which
      # has no write access to Codex -- CODEX_GITHUB_TOKEN (a fine-grained PAT
      # with write access on both Codex and the target engine repo) is what
      # makes both that push AND the later gh-pages deploy possible from any
      # caller. (Not a deploy key: those are disabled org-wide on GitHub.)
      - name: Checkout Codex
        uses: actions/checkout@v4
        with:
          repository: whittakertech/codex
          token: ${{ secrets.CODEX_GITHUB_TOKEN }}
          path: .
          fetch-depth: 0  # full history needed for overlay branch operations

      # ── 2. Set up Node ────────────────────────────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm

      # ── 3. Install root (tools layer) dependencies ────────────────────────
      - name: Install tools layer dependencies
        run: npm install

      # ── 4. Shallow clone engine repository ────────────────────────────────
      - name: Checkout engine repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.engine_owner }}/${{ inputs.engine_repo }}
          ref: ${{ inputs.engine_ref }}
          path: .engine
          fetch-depth: 1

      # ── 5. Download docs artifact from engine workflow ────────────────────
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.docs_artifact_name }}
          path: .engine/docs/api/

      # ── 6. Restore overlay state ──────────────────────────────────────────
      - name: Restore overlay state
        env:
          OVERLAY_BRANCH: source/${{ inputs.engine_owner }}/${{ inputs.engine_repo }}
        run: |
          mkdir -p state-overlay/state

          git fetch origin "$OVERLAY_BRANCH" 2>/dev/null || true

          if git show-ref --verify --quiet "refs/remotes/origin/$OVERLAY_BRANCH"; then
            # Extract only state/ from the overlay branch into state-overlay/
            git archive "remotes/origin/$OVERLAY_BRANCH" state/ 2>/dev/null \
              | tar -x -C state-overlay/ \
              || echo "[codex] No prior state found in overlay branch — starting fresh"
          else
            echo "[codex] Overlay branch does not exist yet — starting with empty state"
          fi

      # ── 7. Mount ingest content ───────────────────────────────────────────
      # Mounted at the ingest ROOT, not under an {owner}_{repo} subdir: this
      # workflow always deploys to ONE engine's own gh-pages branch, so
      # there's nothing to disambiguate -- unlike the shared hatchery preview
      # (bin/codex-preview), which can hold multiple engines in one build and
      # needs that subdir to tell them apart. A prefix here would just be
      # noise in every URL on the engine's dedicated site
      # (oscar.whittakertech.com/installation/, not
      # oscar.whittakertech.com/whittakertech_oscar/installation/).
      - name: Mount ingest content
        run: |
          # Docs (handwritten + YARD-generated API)
          mkdir -p astro/src/_ingest
          if [ -d ".engine/docs/" ]; then
            rsync -a ".engine/docs/" astro/src/_ingest/
          fi

          # Public assets (images, logos)
          if [ -d ".engine/public/" ]; then
            mkdir -p astro/public/_ingest
            rsync -a ".engine/public/" astro/public/_ingest/
          fi

      # ── 8. Run tool orchestration ─────────────────────────────────────────
      - name: Run tool orchestration
        env:
          CODEX_STATE_DIR: ./state-overlay
        run: |
          npm run build
          npm run orchestrate -- \
            --owner="${{ inputs.engine_owner }}" \
            --repo="${{ inputs.engine_repo }}" \
            --ref="${{ inputs.engine_ref }}"

      # ── 8b. Normalize ingest frontmatter ────────────────────────────────
      # Starlight's docsSchema requires a `title` on every doc; engine docs
      # are typically plain Markdown with none. The local preview driver
      # (tools/preview/build.ts) calls this same normalizer after mounting --
      # this step was missing here entirely (this whole workflow had never
      # actually been run before), so every engine's first real publish
      # failed content validation on any doc lacking explicit frontmatter.
      # Must run after step 8's `npm run build` (needs dist/ to exist).
      - name: Normalize ingest frontmatter
        run: node dist/tools/ingest/normalize.js astro/src/_ingest

      # ── 9. Install Astro dependencies ─────────────────────────────────────
      - name: Install Astro dependencies
        run: npm install --prefix astro

      # ── 10. Fetch brand theme + product logo ───────────────────────────────
      # Falls back to the committed snapshot (astro/src/styles/brand-fallback.css)
      # if the brand CDN is unreachable — never blocks a docs publish.
      - name: Fetch brand theme
        run: |
          node dist/tools/brand/fetch.js \
            --product="${{ inputs.engine_repo }}" \
            --source="${CODEX_BRAND_SOURCE:-https://brand.whittakertech.com}" \
          || echo "[codex] brand fetch skipped — using fallback theme"

      # ── 10b. Skip the generic multi-engine landing page ────────────────────
      # astro/src/pages/index.astro lists every subdir under _ingest/ as an
      # "engine" and claims the site root (/) to do it -- correct for the
      # shared hatchery preview, which can hold multiple engines in one
      # build, but wrong here: this workflow mounts exactly one engine at
      # the ingest ROOT (see step 7), so that page would (a) list ingest
      # subdirectories like api/ as if they were separate engines, and
      # (b) win the / route over the ingested docs/index.md, which wants to
      # be this engine's real homepage. Deleting it lets Starlight's own
      # content-collection routing claim / from the ingested index doc
      # instead.
      - name: Skip generic landing page
        run: rm -f astro/src/pages/index.astro

      # ── 11. Build static site ─────────────────────────────────────────────
      - name: Build static site
        env:
          CODEX_SITE_URL: ${{ inputs.site_url }}
          CODEX_ENGINE_NAME: ${{ inputs.engine_repo }}
        run: npm run build --prefix astro

      # ── 11. Persist overlay state ─────────────────────────────────────────
      - name: Persist overlay state
        env:
          OVERLAY_BRANCH: source/${{ inputs.engine_owner }}/${{ inputs.engine_repo }}
        run: |
          git config user.name  "codex[bot]"
          git config user.email "codex[bot]@users.noreply.github.com"

          git fetch origin "$OVERLAY_BRANCH" 2>/dev/null || true

          if git show-ref --verify --quiet "refs/remotes/origin/$OVERLAY_BRANCH"; then
            git checkout -B "$OVERLAY_BRANCH" "remotes/origin/$OVERLAY_BRANCH"
          else
            git checkout --orphan "$OVERLAY_BRANCH"
            git rm -rf . 2>/dev/null || true
          fi

          # Copy only paths declared in .codex_artifacts (currently state/)
          mkdir -p state/
          if [ -d "state-overlay/state" ]; then
            rsync -a state-overlay/state/ state/
          fi

          git add state/

          if git diff --cached --quiet; then
            echo "[codex] No overlay state changes to commit"
          else
            git commit -m "chore: update overlay state for $OWNER/$REPO @ $REF [skip ci]"
            git push origin "$OVERLAY_BRANCH" --force-with-lease
          fi

          # Return to master for subsequent steps (Codex's default branch --
          # matches step 1's explicit `repository: whittakertech/codex`
          # checkout, which has no `ref:` and so lands on master, not main)
          git checkout master

      # ── 11b. Compute custom domain, if any ─────────────────────────────────
      # GitHub Pages reads the CNAME file IN THE PUBLISHED BRANCH as its own
      # source of truth for a repo's custom domain -- with force_orphan:true
      # replacing the branch's entire content on every deploy, a custom
      # domain claimed via the Pages API/UI silently gets DROPPED on the
      # very next deploy unless that deploy's own output includes a CNAME
      # file. Bit Oscar's first live custom-domain deploy this way:
      # oscar.whittakertech.com 404'd immediately after a second run, even
      # though the site itself (whittakertech.github.io/oscar/) was fine.
      # Skipped when site_url is a bare *.github.io URL (no real custom
      # domain to preserve).
      - name: Compute custom domain
        id: cname
        run: |
          HOST=$(echo "${{ inputs.site_url }}" | sed -E 's#^https?://##; s#/.*##')
          if [[ "$HOST" == *.github.io ]]; then
            echo "value=" >> "$GITHUB_OUTPUT"
          else
            echo "value=$HOST" >> "$GITHUB_OUTPUT"
          fi

      # ── 12. Deploy to engine gh-pages ─────────────────────────────────────
      # personal_token (not deploy_key) -- deploy keys are disabled org-wide
      # on GitHub, and a PAT is the documented alternative for
      # external_repository deploys with this action.
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token:      ${{ secrets.CODEX_GITHUB_TOKEN }}
          external_repository: ${{ inputs.engine_owner }}/${{ inputs.engine_repo }}
          publish_dir:         astro/dist/
          force_orphan:        true
          cname:               ${{ steps.cname.outputs.value }}
          user_name:           "codex[bot]"
          user_email:          "codex[bot]@users.noreply.github.com"
          commit_message:      "docs: deploy ${{ inputs.engine_repo }} @ ${{ inputs.engine_ref }} [skip ci]"
