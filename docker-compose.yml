# Hatchery preview of the Codex-unified docs style.
#
# Static-only: nginx serves whatever the local driver last built into
# astro/dist (`npm run preview:build -- --engine <engine> --src <path>`). A
# rebuild is just a re-run of the driver -- the dir is bind-mounted, no image
# rebuild. One build lives in astro/dist at a time (each `bin/codex-preview`
# run overwrites it for whichever engine(s) were most recently ingested), so
# the preview is named after Codex itself, not any one engine -- there's
# nothing per-engine to route by.
#
# Routing: *.hatchery.whittakertech.com already has wildcard DNS + Advanced
# SSL + a tunnel public-hostname, so a Traefik router on the shared `proxy`
# network is all that's needed to publish at codex.hatchery.whittakertech.com.
# Public, no auth -- previewed content is already public at each engine's own
# whittakertech.com site.
name: codex

services:
  preview:
    image: nginx:alpine
    container_name: codex-preview
    restart: unless-stopped
    volumes:
      - ./astro/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.codex-preview.rule=Host(`codex.hatchery.whittakertech.com`)"
      - "traefik.http.routers.codex-preview.entrypoints=web,tunnel"
      - "traefik.http.services.codex-preview.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
