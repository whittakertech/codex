# Serves the Codex-built static site (astro/dist) for a hatchery preview.
# Starlight emits directory-style routes (/midas/ -> /midas/index.html), so we
# fall through to the directory index and use the generated 404 page.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
